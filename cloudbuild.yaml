# Google Cloud Build configuration for Cloud Run deployment
# 
# Usage:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Or trigger automatically from GitHub/Cloud Source Repositories

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/parking-ml-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/parking-ml-api:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/parking-ml-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/parking-ml-api:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'parking-ml-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/parking-ml-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_PASSWORD=${_DB_PASSWORD}'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/parking-ml-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/parking-ml-api:latest'

# Substitution variables (override with --substitutions)
substitutions:
  _REGION: us-central1
  _DB_HOST: ''
  _DB_PORT: '5432'
  _DB_NAME: parking
  _DB_USER: ''
  _DB_PASSWORD: ''

# Build timeout
timeout: 1200s
